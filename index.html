    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: radial-gradient(circle at 50% 0%, #1e2633 0%, #0d1117 100%); color: #f0f4f8; min-height: 100vh; }
        header { background: rgba(13, 17, 23, 0.85); backdrop-filter: blur(10px); padding: 20px 50px; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 30px rgba(0,0,0,0.4); border-bottom: 3px solid #2ecc71; position: sticky; top: 0; z-index: 100; }

        nav a:hover, nav a.active { color: #2ecc71; background: rgba(46, 204, 113, 0.1); text-shadow: 0 0 10px rgba(46, 204, 113, 0.6); transform: translateY(-1px); }
        .main-wrapper { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .top-grid { display: grid; grid-template-columns: 1fr 320px; gap: 30px; margin-bottom: 40px; }
        @media (max-width: 900px) { .top-grid { grid-template-columns: 1fr; } }
        .hero-banner { background: rgba(22, 29, 39, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); backdrop-filter: blur(8px); border-radius: 16px; padding: 50px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .server-logo { max-width: 100%; height: auto; max-height: 200px; margin-bottom: 25px; filter: drop-shadow(0px 8px 15px rgba(0,0,0,0.5)); }
        .hero-banner p { color: #cbd5e0; font-size: 16px; max-width: 550px; line-height: 1.6; margin-bottom: 30px; font-weight: 500; }
        .ip-box-new { display: flex; align-items: center; background: #1a202c; color: white; padding: 14px 30px; border-radius: 8px; font-weight: 700; font-size: 16px; border: 1px solid #2ecc71; box-shadow: 0 0 15px rgba(46, 204, 113, 0.2); }
        .ip-box-new span { color: #f1c40f; margin-left: 8px; user-select: all; text-shadow: 0 0 8px rgba(241, 196, 15, 0.4); }
        .sidebar { display: flex; flex-direction: column; gap: 15px; }
        .cta-button { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 22px; border-radius: 12px; text-align: center; color: white; font-weight: 700; text-transform: uppercase; text-decoration: none; font-size: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: all 0.2s ease; }
        .cta-button:hover { transform: translateY(-3px); filter: brightness(1.15); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .btn-pink { background: linear-gradient(135deg, #ec4899 0%, #be185d 100%); border: 1px solid #f472b6; }
        .btn-green { background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%); border: 1px solid #4ade80; box-shadow: 0 4px 15px rgba(46,204,113,0.3); }
        .btn-blue { background: linear-gradient(135deg, #5865F2 0%, #404eed 100%); border: 1px solid #7289da; box-shadow: 0 4px 15px rgba(88,101,242,0.3); }
        .btn-svg-icon { width: 20px; height: 20px; fill: currentColor; display: flex; align-items: center; }
        .media-section { width: 100%; margin-top: 20px; }
        .section-title { text-align: center; text-transform: uppercase; background: linear-gradient(135deg, #f1c40f 0%, #d68910 100%); color: #111; display: inline-block; padding: 10px 30px; font-size: 14px; font-weight: 800; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 4px 10px rgba(241,196,15,0.2); letter-spacing: 0.5px; }
        .title-wrapper { text-align: center; margin-bottom: 20px; }
        .social-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .social-card { background: rgba(22, 29, 39, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); backdrop-filter: blur(8px); border-radius: 14px; padding: 25px; display: flex; align-items: center; justify-content: center; gap: 18px; text-decoration: none; color: white; transition: all 0.3s ease; }
        .social-card:hover { transform: translateY(-4px); background: rgba(30, 41, 59, 0.8); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .social-card.tiktok:hover { border-color: #00f2fe; box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); }
        .social-card.youtube:hover { border-color: #ff0000; box-shadow: 0 0 15px rgba(255, 0, 0, 0.4); }
        .social-icon-emoji { font-size: 36px; flex-shrink: 0; }
        .social-info { text-align: left; }
        .social-name { font-size: 16px; font-weight: 800; color: #f0f4f8; text-transform: uppercase; margin-bottom: 2px; }
        .social-desc { font-size: 12px; color: #a0aec0; font-weight: 600; }
